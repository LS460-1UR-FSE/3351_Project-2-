<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Metadata-->
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linux Tome</title>

    <link rel="stylesheet" href="styles.css"> <!-- Link to stylesheet -->
    <script src="script.js" defer></script> <!-- Link to JavaScript -->

</head>

<body>

    <header> <!--header and subheader-->
        <h1>Linux Tome</h1>
        <p> A quick reference guide to the Linux CLI </p>
    </header>

    <main>
        <section> 

            <h2> <!--description of this project-->
                Find a Linux Command
            </h2>

            <!--label uses "for" and matches input "id"-->
            <label for="search_input">Search by command or command description</label>

            <!--JS reads this for the filter-->
            <input
                type="search"
                id="search_input"
                placeholder="Ex. ls, cat, grep"
            > 

            <!--Js updates this when the results change, status displays what is currently happenign to reader-->
            <p id="search_status" role="status">showing all commands</p>

            <!--JS updates message when results change-->
            <div id="command_grid" class="command_grid">

                

            </div>
        </section>

        <section id="command_details" hidden>
            <h2 id="command_name" tabindex="-1"></h2>
            <p id="command_description"></p>

            <h3>Syntax</h3>
            <pre><code id= "command_syntax"></code></pre>

            <h3>Example</h3>
            <div id="command_examples"></div>
        </section>
    </main>

    <footer> <!--copyright stuff-->
        <p>Jordan Lopez, 2026</p>
    </footer>
</body>
</html>
